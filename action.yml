name: "W System E-Invoice Validator"
description: "Validate UBL, CII, XRechnung and ZUGFeRD/Factur-X invoices offline against EN 16931 and XRechnung rules in CI."
author: "W System"
branding:
  icon: "check-square"
  color: "blue"
inputs:
  files:
    description: "Glob(s), path(s), or directory of invoice files to check, one per line or comma-separated (XML or ZUGFeRD/Factur-X PDF)."
    required: false
    default: ""
  paths:
    description: "Alias for 'files'. If both 'files' and 'paths' are omitted, defaults to '**/*.xml'."
    required: false
    default: ""
  rules:
    description: "Validation ruleset / profile: auto | en16931 | xrechnung."
    required: false
    default: "auto"
  profile:
    description: "Optional alias for 'rules' (auto | en16931 | xrechnung)."
    required: false
    default: ""
  fail-on:
    description: "When to fail the step: error | warning | none."
    required: false
    default: "error"
  fail-on-warnings:
    description: "Deprecated alias for fail-on: warning (true | false)."
    required: false
    default: "false"
  license-key:
    description: "Optional W System Validator commercial licence key (WSV1...) for commercial rule packs and pro features (passed via env file, never logged)."
    required: false
    default: ""
  rule-pack:
    description: "Optional rule pack ID (for example 2026.11.1) when using a commercial validator image."
    required: false
    default: ""
  engine:
    description: "Validation engine: local (offline Docker container with --network none, default) or api (hosted W System API)."
    required: false
    default: "local"
  image:
    description: "Container image used when engine is 'local'."
    required: false
    default: "ghcr.io/wsystemdev/einvoice-validator:0.1"
  report-format:
    description: "Report file(s) to write: both | sarif | json | none."
    required: false
    default: "both"
  json-report:
    description: "Output path for the JSON validation report."
    required: false
    default: "wsystem-einvoice-report.json"
  sarif-report:
    description: "Output path for the SARIF 2.1.0 validation report."
    required: false
    default: "wsystem-einvoice-report.sarif"
  fail-on-empty:
    description: "Fail the step when no files match the input globs (true | false)."
    required: false
    default: "false"
  api-key:
    description: "Optional W System API key when engine is 'api'."
    required: false
    default: ""
  api-url:
    description: "W System API base URL when engine is 'api'."
    required: false
    default: "https://api.wsystem.dev"
outputs:
  checked:
    description: "Number of files checked."
    value: ${{ steps.validate.outputs.checked }}
  failed:
    description: "Number of files that failed according to fail-on."
    value: ${{ steps.validate.outputs.failed }}
  valid:
    description: "'true' if failed == 0, otherwise 'false'."
    value: ${{ steps.validate.outputs.valid }}
  json-report:
    description: "Path to the JSON report file if written."
    value: ${{ steps.validate.outputs.json-report }}
  sarif-report:
    description: "Path to the SARIF 2.1.0 report file if written."
    value: ${{ steps.validate.outputs.sarif-report }}
  rule-pack:
    description: "Rule pack version used by the validator."
    value: ${{ steps.validate.outputs.rule-pack }}
runs:
  using: "composite"
  steps:
    - id: validate
      shell: bash
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_RULES: ${{ inputs.rules }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FAIL_ON_WARNINGS: ${{ inputs.fail-on-warnings }}
        INPUT_LICENSE_KEY: ${{ inputs.license-key }}
        INPUT_RULE_PACK: ${{ inputs.rule-pack }}
        INPUT_ENGINE: ${{ inputs.engine }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_REPORT_FORMAT: ${{ inputs.report-format }}
        INPUT_JSON_REPORT: ${{ inputs.json-report }}
        INPUT_SARIF_REPORT: ${{ inputs.sarif-report }}
        INPUT_FAIL_ON_EMPTY: ${{ inputs.fail-on-empty }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_API_URL: ${{ inputs.api-url }}
      run: python3 "${{ github.action_path }}/validate.py"
